name: Release

on:
  push:
    tags: ["v*"]
  # Lets the whole pipeline be dry run without publishing: both binaries are
  # built and uploaded as run artifacts, and the release itself is skipped.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # `musl-gcc` links the static binary; `.cargo/config.toml` names it.
      - name: musl-gcc
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Package
        run: |
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          sh contrib/package-release.sh "$tag" "${{ matrix.target }}"

      - name: The archive works
        run: |
          name="linux_boot_analyzer_tui-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-${{ matrix.target }}"
          tar -xzf "dist/$name.tar.gz"
          "./$name/linux_boot_analyzer_tui" --version
          (sleep 1; printf '2v4q') | timeout 20 script -qec "stty rows 34 cols 132; ./$name/linux_boot_analyzer_tui" /dev/null
          echo "the packaged binary started, navigated and quit cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: linux_boot_analyzer_tui-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      # Both architectures meet here, so one job writes the release: parallel
      # uploads to the same release would race.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
