name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the archive
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 22.04 is deliberate: the runner's glibc (2.35) becomes the binary's
      # floor, so the archive still starts on Debian 12 and Ubuntu 22.04. A
      # newer runner would ship a binary that refuses to run there.
      - name: Package
        run: sh contrib/package-release.sh "$GITHUB_REF_NAME"

      - name: The archive works
        run: |
          name="linux_boot_analyzer_tui-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-x86_64-unknown-linux-gnu"
          tar -xzf "dist/$name.tar.gz"
          "./$name/linux_boot_analyzer_tui" --version
          (sleep 1; printf '2v4q') | timeout 20 script -qec "stty rows 34 cols 132; ./$name/linux_boot_analyzer_tui" /dev/null
          echo "the packaged binary started, navigated and quit cleanly"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          generate_release_notes: true
