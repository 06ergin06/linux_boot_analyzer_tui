name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release --locked

  smoke:
    name: The interface starts and quits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # `script` hands the child a pty; `stty` gives it a real size, without
      # which the UI draws nothing and this proves nothing.
      - name: Start, navigate and quit
        run: |
          (sleep 1; printf '2v4q') | timeout 20 script -qec "stty rows 34 cols 132; ./target/debug/linux_boot_analyzer_tui" /dev/null
          echo "the interface started, navigated and quit cleanly"

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check the declared rust-version still builds
        run: cargo check --locked
