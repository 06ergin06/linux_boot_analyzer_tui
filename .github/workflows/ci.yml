name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    name: Format, lints and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Release build
        run: cargo build --release --locked

  smoke:
    name: The interface starts and quits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # `script` hands the child a pty; `stty` gives it a real size, without
      # which the UI draws nothing and this proves nothing.
      - name: Start, navigate and quit
        run: |
          (sleep 1; printf '2v4q') | timeout 20 script -qec "stty rows 34 cols 132; ./target/debug/linux-boot-analyzer" /dev/null
          echo "the interface started, navigated and quit cleanly"

  package:
    name: The release archive can be built (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: musl-gcc
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The same script a tag runs, so a broken release is caught here.
      - name: Package
        run: sh contrib/package-release.sh "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" "${{ matrix.target }}"

      - name: The archive works
        run: |
          name="linux-boot-analyzer-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-${{ matrix.target }}"
          tar -xzf "dist/$name.tar.gz"
          "./$name/linux-boot-analyzer" --version
          (sleep 1; printf '2v4q') | timeout 20 script -qec "stty rows 34 cols 132; ./$name/linux-boot-analyzer" /dev/null
          echo "the packaged binary started, navigated and quit cleanly"

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check the declared rust-version still builds
        run: cargo check --locked
