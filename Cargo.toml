[package]
name = "linux-boot-analyzer"
version = "1.1.0"
edition = "2024"
# 1.88 is not a preference: let-chains (edition 2024) and ratatui 0.30 need it.
rust-version = "1.88"
description = "A terminal UI that analyses Linux boot time and manages systemd services"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/06ergin06/linux_boot_analyzer_tui"
keywords = ["tui", "systemd", "boot", "ratatui", "linux"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# One codegen unit, LTO and a strip for the binary people actually run.
# No `panic = "abort"`: `ratatui::run` restores the terminal while unwinding.
[profile.release]
lto = true
strip = true
codegen-units = 1
